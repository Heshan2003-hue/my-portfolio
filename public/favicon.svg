<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141418" />
      <stop offset="100%" stop-color="#07070A" />
    </linearGradient>
    <linearGradient id="electricGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF275" />
      <stop offset="100%" stop-color="#FFDE02" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#FFDE02" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Dark Rounded Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#2A2A30" stroke-width="1.5"/>

  <!-- Electric Yellow Accent Border Beam Highlights -->
  <path d="M8 22 A 14 14 0 0 1 22 8" fill="none" stroke="#FFDE02" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M56 42 A 14 14 0 0 1 42 56" fill="none" stroke="#FFDE02" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Letter R (Electric Yellow with Glow) -->
  <path d="M16 17 H26 C31 17 34 19.5 34 23.5 C34 26.5 32 28.8 28.5 29.5 L35.5 47 H28.5 L22.5 32.5 H22 V47 H16 V17 Z M22 22.5 V27.5 H25.5 C27.5 27.5 28.5 26.5 28.5 25 C28.5 23.5 27.5 22.5 25.5 22.5 H22 Z" fill="url(#electricGrad)" filter="url(#subtleGlow)"/>

  <!-- Letter H (Crisp High-Contrast White) -->
  <path d="M37 17 H43 V29 H49 V17 H55 V47 H49 V34.5 H43 V47 H37 V17 Z" fill="#FFFFFF"/>
</svg>
